# Log4j2 Configuration for Console and File Logging
status = error
name = Log4j2Config
monitorInterval = 30

# Console Appender Configuration
appender.console.type = Console
appender.console.name = ConsoleAppender
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg (%F:%L)%n

# File Appender Configuration
appender.file.type = File
appender.file.name = FileAppender
appender.file.fileName = ./logs/application.log
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg (%F:%L)%n
appender.file.policies.type = Policies
appender.file.policies.time.type = TimeBasedTriggeringPolicy
appender.file.policies.time.interval = 1
appender.file.policies.size.type = SizeBasedTriggeringPolicy
appender.file.policies.size.size = 10MB

# Root Logger - Logs INFO and higher (INFO, WARN, ERROR)
rootLogger.level = info
rootLogger.appenderRefs = console, file
rootLogger.appenderRef.console.ref = ConsoleAppender
rootLogger.appenderRef.file.ref = FileAppender

# Error Logger
logger.errorLogger.name = com.example.error
logger.errorLogger.level = error
logger.errorLogger.additivity = false
logger.errorLogger.appenderRefs = console, file
logger.errorLogger.appenderRef.console.ref = ConsoleAppender
logger.errorLogger.appenderRef.file.ref = FileAppender